<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warframe PriceCheckList</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="alertsManager.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body class="text-gray-200 font-sans antialiased min-h-screen flex flex-col pb-8">

    <div id="loading-screen" class="fixed inset-0 bg-gray-950 z-50 flex flex-col items-center justify-center p-6 select-none">
        <div class="max-w-md w-full bg-gray-900/60 border border-gray-800/80 p-8 rounded-2xl backdrop-blur-md shadow-2xl flex flex-col gap-6">
            <div class="text-center">
                <i class="fa-solid fa-chart-line text-cyan-400 text-4xl mb-3 drop-shadow-[0_0_10px_rgba(34,211,238,0.4)]"></i>
                <h1 class="text-xl font-bold text-white tracking-wide uppercase">PriceCheckList</h1>
                <p class="text-xs text-gray-400 mt-1">Initialisation et téléchargement des index</p>
            </div>

            <div class="w-full bg-gray-950 rounded-full h-2.5 overflow-hidden border border-gray-800">
                <div id="progress-bar" class="bg-cyan-400 h-full w-0 transition-all duration-300 shadow-[0_0_10px_rgba(34,211,238,0.6)]"></div>
            </div>

            <div class="bg-gray-950/50 rounded-xl p-4 border border-gray-800/50 text-sm font-mono flex flex-col gap-2.5" id="progress-checklist">
                <div id="check-version" class="flex items-center justify-between text-gray-500">
                    <span><i class="fa-solid fa-circle-notch fa-spin mr-2 text-cyan-400"></i>api_version.json</span>
                    <span class="text-xs">En attente</span>
                </div>
            </div>
            
            <div id="loading-status-text" class="text-center text-xs text-gray-400 italic">
                Connexion aux serveurs...
            </div>
        </div>
    </div>

    <header class="bg-gray-950/80 border-b border-gray-800/60 sticky top-0 z-40 backdrop-blur-md shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.reload()">
                    <i class="fa-solid fa-chart-line text-cyan-400 text-xl drop-shadow-[0_0_8px_rgba(34,211,238,0.5)]"></i>
                    <span class="font-bold text-lg text-white tracking-wider uppercase">PCL</span>
                </div>
                <nav id="nav-tabs" class="hidden md:flex space-x-1"></nav>
                <button id="pinned-page-btn" class="hidden md:inline-flex items-center gap-2 text-xs text-gray-400 hover:text-cyan-400 transition-colors px-3 py-2 rounded-lg border border-gray-800/70 bg-gray-950/60 hover:bg-gray-900/80">
                    <i class="fa-solid fa-thumbtack"></i>
                    Mes Épinglés
                </button>
                <div class="flex items-center gap-2">
                    <button id="alerts-btn" class="relative text-gray-400 hover:text-cyan-400 transition-colors text-sm font-medium px-3 py-2 rounded-lg hover:bg-gray-800/30">
                        <i class="fa-solid fa-bell"></i>
                        <span id="alerts-count" class="absolute -top-1 -right-1 inline-flex items-center justify-center h-5 min-w-[18px] rounded-full bg-rose-500 text-[10px] font-bold text-white leading-none px-1 hidden">0</span>
                    </button>
                    <a id="download-xlsx-link" href="https://raw.githubusercontent.com/Protideus/PriceCheckList/main/data/Warframe_Prices_Latest.xlsx" class="relative text-gray-400 hover:text-cyan-400 transition-colors text-sm font-medium px-3 py-2 rounded-lg hover:bg-gray-800/30" title="Télécharger le fichier Excel">
                        <i class="fa-solid fa-floppy-disk"></i>
                    </a>
                    <button id="guide-btn" class="text-gray-400 hover:text-cyan-400 transition-colors text-sm font-medium px-3 py-2 rounded-lg hover:bg-gray-800/30">
                        <i class="fa-solid fa-book mr-1"></i> GUIDE
                    </button>
                    <button id="readme-btn" class="text-gray-400 hover:text-cyan-400 transition-colors text-sm font-medium px-3 py-2 rounded-lg hover:bg-gray-800/30">
                        <i class="fa-solid fa-file-lines mr-1"></i> README
                    </button>
                    <button id="author-btn" class="text-gray-400 hover:text-cyan-400 transition-colors text-sm font-medium px-3 py-2 rounded-lg hover:bg-gray-800/30">
                        <i class="fa-solid fa-user mr-1"></i> Auteur
                    </button>
                </div>
            </div>
        </div>
        <div class="md:hidden bg-gray-950/90 border-t border-gray-800/40 overflow-x-auto whitespace-nowrap px-4 py-2 flex items-center space-x-2" id="nav-tabs-mobile"></div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-4">
        
        <div class="bg-gray-900/60 p-4 rounded-2xl border border-gray-800/40 backdrop-blur-md flex flex-col sm:flex-row gap-4 items-center justify-between shadow-xl">
            <div class="relative w-full sm:w-80">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-500">
                    <i class="fa-solid fa-magnifying-glass text-cyan-500/70"></i>
                </span>
                <input type="text" id="search-input" class="w-full pl-10 pr-10 py-2.5 bg-gray-950/50 border border-gray-800/80 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500/30 transition-all text-sm" placeholder="Rechercher un objet (FR ou EN)...">
                <button id="clear-search-btn" class="absolute inset-y-0 right-2 flex items-center justify-center text-gray-400 hover:text-white transition-colors opacity-0 pointer-events-none" type="button" aria-label="Effacer la recherche">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                <div id="rank-filter-container" class="flex items-center gap-2 opacity-40">
                    <label for="rank-filter" class="hidden sm:inline-block text-[11px] uppercase tracking-[0.22em] text-gray-400">Filtre rang</label>
                    <select id="rank-filter" class="min-w-[180px] w-full bg-gray-950/50 border border-gray-800/80 rounded-xl text-white text-sm px-3 py-2 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500/30 transition-all disabled:cursor-not-allowed disabled:bg-gray-900/40 disabled:border-gray-700 disabled:text-gray-500">
                        <option value="all">Tous les rangs</option>
                        <option value="r0">Rang 0 uniquement</option>
                        <option value="rmax">Rang Max uniquement</option>
                    </select>
                </div>
                <button id="copy-data-btn" class="inline-flex items-center gap-2 text-xs text-gray-400 hover:text-cyan-400 transition-colors px-3 py-2 rounded-lg border border-gray-800/70 bg-gray-950/60 hover:bg-gray-900/80">
                    <i class="fa-regular fa-copy"></i>
                    Copier
                </button>
            </div>
            <div class="text-xs text-gray-400 font-mono bg-gray-950/40 px-3 py-1.5 rounded-lg border border-gray-800/30 flex items-center gap-2" id="api-version-info">
                <i class="fa-solid fa-clock text-cyan-500"></i> Index non synchronisé
            </div>
        </div>

        <div class="bg-gray-900/40 rounded-2xl border border-gray-800/40 backdrop-blur-md overflow-hidden flex-grow shadow-2xl flex flex-col min-h-[400px]">
            <div class="overflow-x-auto flex-grow">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b border-gray-800 bg-gray-950/40 text-gray-400 font-medium uppercase tracking-wider text-xs select-none whitespace-nowrap">
                            <th class="p-4 cursor-pointer hover:text-cyan-400 transition-colors" onclick="handleSort('n_fr')">
                                Nom de l'objet <span id="sort-icon-n_fr" class="ml-1 text-gray-600"></span>
                            </th>
                            <th class="p-4 cursor-pointer hover:text-cyan-400 transition-colors text-right" onclick="handleSort('p')">
                                PRIX <span id="sort-icon-p" class="ml-1 text-gray-600"></span>
                            </th>
                            <th class="p-4 cursor-pointer hover:text-cyan-400 transition-colors text-right" onclick="handleSort('v')">
                                VOLUME <span id="sort-icon-v" class="ml-1 text-gray-600"></span>
                            </th>
                            <th class="p-4 cursor-pointer hover:text-cyan-400 transition-colors text-right" onclick="handleSort('p90')">
                                Δ90 <span id="sort-icon-p90" class="ml-1 text-gray-600"></span>
                            </th>
                            <th class="p-4 cursor-pointer hover:text-cyan-400 transition-colors text-right" onclick="handleSort('vr')">
                                HYPE <span id="sort-icon-vr" class="ml-1 text-gray-600"></span>
                            </th>
                            <th class="p-4 cursor-pointer hover:text-cyan-400 transition-colors text-left" onclick="handleSort('ds')">
                                DONCHIAN <span id="sort-icon-ds" class="ml-1 text-gray-600"></span>
                            </th>
                            <th class="p-4 cursor-pointer hover:text-cyan-400 transition-colors text-center" onclick="handleSort('f')">
                                FIABILITE <span id="sort-icon-f" class="ml-1 text-gray-600"></span>
                            </th>
                            <th class="p-4 text-center">
                                Action
                            </th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-gray-800/40">
                    </tbody>
                </table>
                <div id="no-results" class="hidden text-center py-12 text-gray-500 italic">
                    <i class="fa-solid fa-box-open text-2xl mb-2 block"></i> Aucun élément ne correspond à votre recherche.
                </div>
            </div>
        </div>
    </main>

    <div id="bg-loader-status" class="fixed bottom-4 right-4 z-50 min-w-[280px] bg-gray-950/90 backdrop-blur-md border border-cyan-500/30 p-3 rounded-lg shadow-2xl shadow-cyan-950/20 transform translate-y-0 transition-all duration-700 ease-in-out">
        <div class="flex items-center justify-between mb-2">
            <div class="flex items-center space-x-2">
                <span id="bg-loader-ping" class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                    <span id="bg-loader-dot" class="relative inline-flex rounded-full h-2 w-2 bg-cyan-500"></span>
                </span>
                <span class="text-[10px] font-mono tracking-widest text-cyan-400 uppercase font-bold">PCL_CORE_SYNC</span>
            </div>
            <span id="bg-loader-percent" class="text-xs font-mono font-bold text-cyan-400 bg-cyan-950/50 px-1.5 py-0.5 rounded border border-cyan-500/20">0%</span>
        </div>

        <div class="space-y-1.5">
            <div id="bg-loader-text" class="text-xs font-medium text-gray-300 truncate">
                Initialisation du flux...
            </div>
            
            <div class="w-full h-1 bg-gray-900 rounded-full overflow-hidden border border-gray-800">
                <div id="bg-loader-bar" class="h-full w-0 bg-gradient-to-r from-cyan-500 to-blue-600 transition-all duration-300 ease-out"></div>
            </div>
        </div>
    </div>

    <div id="modal-container" class="fixed inset-0 bg-gray-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300" onclick="closeModal(event)">
        <div id="modal-content" class="bg-gray-900/95 border border-gray-800/60 w-full max-w-xl rounded-2xl overflow-hidden shadow-2xl m-4 transform scale-95 transition-transform duration-300" onclick="event.stopPropagation()">
        </div>
    </div>
    <script>
    (function(){
        const RAW_XLSX_URL = 'https://raw.githubusercontent.com/Protideus/PriceCheckList/main/data/Warframe_Prices_Latest.xlsx';

        function formatVersionDate(versionData){
            if (!versionData || !versionData.last_run) return null;
            const d = new Date(versionData.last_run);
            if (Number.isNaN(d.getTime())) return null;
            const locale = navigator.language || 'fr-FR';
            const dateStr = d.toLocaleDateString(locale, {day: 'numeric', month: 'long', year: 'numeric'});
            const timeStr = d.toLocaleTimeString(locale, {hour: '2-digit', minute: '2-digit'});
            const pad = n => String(n).padStart(2,'0');
            const fnDate = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
            return {
                label: `Mise à jour le ${dateStr} à ${timeStr}`,
                filename: `Warframe_Prices_${fnDate}.xlsx`
            };
        }

        window.xlsxManager = window.xlsxManager || {};
        window.updateXlsxMetadata = function(versionData) {
            const link = document.getElementById('download-xlsx-link');
            if (!link) return;
            const formatted = formatVersionDate(versionData);
            if (formatted) {
                link.title = `Télécharger le fichier Excel (${formatted.label})`;
                link.dataset.suggestedFilename = formatted.filename;
            } else {
                link.title = 'Télécharger le fichier Excel';
            }
            link.href = RAW_XLSX_URL;
        };

        async function downloadWithFilename(event){
            event.preventDefault();
            const link = event.currentTarget;
            const url = link.href;
            const suggested = link.dataset.suggestedFilename || 'Warframe_Prices_Latest.xlsx';
            try{
                const resp = await fetch(url);
                if(!resp.ok) throw new Error('Failed to download file');
                const blob = await resp.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = suggested;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(()=> URL.revokeObjectURL(blobUrl), 10000);
            }catch(err){
                window.open(url, '_blank', 'noopener');
            }
        }

        const init = () => {
            const dl = document.getElementById('download-xlsx-link');
            if(dl) dl.addEventListener('click', downloadWithFilename);
        };
        init();
    })();
    </script>
</body>
</html>
