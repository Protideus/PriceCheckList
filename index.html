<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warframe PriceCheckList</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Ambiance Graphique Immersive*/
        body {
            background-image: linear-gradient(rgba(3, 7, 18, 0.90), rgba(3, 7, 18, 0.90)), url('PCL_background.jpg');
            background-size: cover;
            background-position: center bottom; /* Aligné par le bas pour voir la rue et les personnages */
            background-attachment: fixed;
        }

        /* Personnalisation fine des barres de défilement */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(3, 7, 18, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(75, 85, 99, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #22d3ee;
        }

        /* Onglets Actifs - Style Néon Soft ModTrad */
        .tab-active {
            color: #ffffff !important;
            border-color: #22d3ee !important;
            background-color: rgba(34, 211, 238, 0.08);
            text-shadow: 0 0 8px rgba(34, 211, 238, 0.6);
        }

        /* Effet de surbrillance au survol d'une ligne du tableau */
        .table-row-hover {
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
        }
        .table-row-hover:hover {
            background-color: rgba(255, 255, 255, 0.02);
            border-left-color: #22d3ee;
        }

        /* Fiabilité des indicateurs économiques (f) */
        .fiability-3 { color: #10b981; text-shadow: 0 0 6px rgba(16, 185, 129, 0.2); }
        .fiability-2 { color: #f59e0b; }
        .fiability-1 { color: #ef4444; }
        .fiability-0 { color: #6b7280; }
        
            /* Animations des modales */
            #modal-container {
                opacity: 0;
                transition: opacity 0.3s ease;
            }
            #modal-container.modal-show {
                opacity: 1;
            }
            #modal-content {
                transform: scale(0.95);
                transition: transform 0.3s ease;
            }
            #modal-content.modal-scale {
                transform: scale(1);
            }
    </style>
</head>
<body class="text-gray-200 font-sans antialiased min-h-screen flex flex-col pb-8">

    <div id="loading-screen" class="fixed inset-0 bg-gray-950 z-50 flex flex-col items-center justify-center p-6 select-none">
        <div class="max-w-md w-full bg-gray-900/60 border border-gray-800/80 p-8 rounded-2xl backdrop-blur-md shadow-2xl flex flex-col gap-6">
            <div class="text-center">
                <i class="fa-solid fa-chart-line text-cyan-400 text-4xl mb-3 drop-shadow-[0_0_10px_rgba(34,211,238,0.4)]"></i>
                <h1 class="text-xl font-bold text-white tracking-wide uppercase">PriceCheckList</h1>
                <p class="text-xs text-gray-400 mt-1">Initialisation et téléchargement des index</p>
            </div>

            <div class="w-full bg-gray-950 rounded-full h-2.5 overflow-hidden border border-gray-800">
                <div id="progress-bar" class="bg-cyan-400 h-full w-0 transition-all duration-300 shadow-[0_0_10px_rgba(34,211,238,0.6)]"></div>
            </div>

            <div class="bg-gray-950/50 rounded-xl p-4 border border-gray-800/50 text-sm font-mono flex flex-col gap-2.5" id="progress-checklist">
                <div id="check-version" class="flex items-center justify-between text-gray-500">
                    <span><i class="fa-solid fa-circle-notch fa-spin mr-2 text-cyan-400"></i>api_version.json</span>
                    <span class="text-xs">En attente</span>
                </div>
            </div>
            
            <div id="loading-status-text" class="text-center text-xs text-gray-400 italic">
                Connexion aux serveurs...
            </div>
        </div>
    </div>

    <header class="bg-gray-950/80 border-b border-gray-800/60 sticky top-0 z-40 backdrop-blur-md shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.reload()">
                    <i class="fa-solid fa-chart-line text-cyan-400 text-xl drop-shadow-[0_0_8px_rgba(34,211,238,0.5)]"></i>
                    <span class="font-bold text-lg text-white tracking-wider uppercase">PCL</span>
                </div>
                <nav id="nav-tabs" class="hidden md:flex space-x-1"></nav>
                <div class="flex items-center gap-2">
                    <button id="guide-btn" class="text-gray-400 hover:text-cyan-400 transition-colors text-sm font-medium px-3 py-2 rounded-lg hover:bg-gray-800/30">
                        <i class="fa-solid fa-book mr-1"></i> GUIDE
                    </button>
                    <button id="readme-btn" class="text-gray-400 hover:text-cyan-400 transition-colors text-sm font-medium px-3 py-2 rounded-lg hover:bg-gray-800/30">
                        <i class="fa-solid fa-file-lines mr-1"></i> README
                    </button>
                    <button id="author-btn" class="text-gray-400 hover:text-cyan-400 transition-colors text-sm font-medium px-3 py-2 rounded-lg hover:bg-gray-800/30">
                        <i class="fa-solid fa-user mr-1"></i> Auteur
                    </button>
                </div>
            </div>
        </div>
        <div class="md:hidden bg-gray-950/90 border-t border-gray-800/40 overflow-x-auto whitespace-nowrap px-4 py-2 flex space-x-2" id="nav-tabs-mobile"></div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-4">
        
        <div class="bg-gray-900/60 p-4 rounded-2xl border border-gray-800/40 backdrop-blur-md flex flex-col sm:flex-row gap-4 items-center justify-between shadow-xl">
            <div class="relative w-full sm:w-80">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-500">
                    <i class="fa-solid fa-magnifying-glass text-cyan-500/70"></i>
                </span>
                <input type="text" id="search-input" class="w-full pl-10 pr-4 py-2.5 bg-gray-950/50 border border-gray-800/80 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500/30 transition-all text-sm" placeholder="Rechercher un objet (FR ou EN)...">
            </div>

            <div class="text-xs text-gray-400 font-mono bg-gray-950/40 px-3 py-1.5 rounded-lg border border-gray-800/30 flex items-center gap-2" id="api-version-info">
                <i class="fa-solid fa-clock text-cyan-500"></i> Index non synchronisé
            </div>
        </div>

        <div class="bg-gray-900/40 rounded-2xl border border-gray-800/40 backdrop-blur-md overflow-hidden flex-grow shadow-2xl flex flex-col min-h-[400px]">
            <div class="overflow-x-auto flex-grow">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b border-gray-800 bg-gray-950/40 text-gray-400 font-medium uppercase tracking-wider text-xs select-none">
                            <th class="p-4 cursor-pointer hover:text-cyan-400 transition-colors" onclick="handleSort('n_fr')">
                                Nom de l'objet <span id="sort-icon-n_fr" class="ml-1 text-gray-600"></span>
                            </th>
                            <th class="p-4 cursor-pointer hover:text-cyan-400 transition-colors text-right" onclick="handleSort('p')">
                                Prix Actuel (p) <span id="sort-icon-p" class="ml-1 text-gray-600"></span>
                            </th>
                            <th class="p-4 cursor-pointer hover:text-cyan-400 transition-colors text-right" onclick="handleSort('p30')">
                                Prix 30j (p30) <span id="sort-icon-p30" class="ml-1 text-gray-600"></span>
                            </th>
                            <th class="p-4 cursor-pointer hover:text-cyan-400 transition-colors text-right" onclick="handleSort('p90')">
                                Prix 90j (p90) <span id="sort-icon-p90" class="ml-1 text-gray-600"></span>
                            </th>
                            <th class="p-4 cursor-pointer hover:text-cyan-400 transition-colors text-right" onclick="handleSort('v')">
                                Volume (v) <span id="sort-icon-v" class="ml-1 text-gray-600"></span>
                            </th>
                            <th class="p-4 cursor-pointer hover:text-cyan-400 transition-colors text-right" onclick="handleSort('vr')">
                                Vol. Ratio (vr) <span id="sort-icon-vr" class="ml-1 text-gray-600"></span>
                            </th>
                            <th class="p-4 cursor-pointer hover:text-cyan-400 transition-colors text-center" onclick="handleSort('f')">
                                Fiabilité (f) <span id="sort-icon-f" class="ml-1 text-gray-600"></span>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-gray-800/40">
                        </tbody>
                </table>
                <div id="no-results" class="hidden text-center py-12 text-gray-500 italic">
                    <i class="fa-solid fa-box-open text-2xl mb-2 block"></i> Aucun élément ne correspond à votre recherche.
                </div>
            </div>
        </div>
    </main>

    <div id="modal-container" class="fixed inset-0 bg-gray-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300" onclick="closeModal(event)">
        <div id="modal-content" class="bg-gray-900/95 border border-gray-800/60 w-full max-w-xl rounded-2xl overflow-hidden shadow-2xl m-4 transform scale-95 transition-transform duration-300" onclick="event.stopPropagation()">
            </div>
    </div>

    <script>
        // CONFIGURATION DES SECTIONS DU SITE
        const CATEGORIES = [
            { id: "warframes", label: "Warframes", icon: "fa-shield-halved" },
            { id: "armes", label: "Armes", icon: "fa-gun" },
            { id: "equipements", label: "Équipements", icon: "fa-robot" },
            { id: "reliques", label: "Reliques", icon: "fa-cube" },
            { id: "mods", label: "Mods", icon: "fa-id-card" },
            { id: "arcanes", label: "Arcanes", icon: "fa-gem" },
            { id: "ressources", label: "Ressources", icon: "fa-box-tissue" }
        ];

        // ÉTAT GLOBAL DE L'APPLICATION
        let appState = {
            currentCategory: "warframes",
            searchQuery: "",
            sortColumn: "n_fr",
            sortDirection: "asc",
            tables: {},       // Index d'indicateurs économiques légers
            details: {},      // Dictionnaires de descriptions lourdes (cache)
            versionInfo: null
        };

        // INITIALISATION DE L'APPLICATION
        window.addEventListener("DOMContentLoaded", async () => {
            buildProgressChecklist();
            await initializeLoadingSequence();
            buildNavigationTabs();
            renderTable();
            
            // Écouteur pour la recherche dynamique
            document.getElementById("search-input").addEventListener("input", (e) => {
                appState.searchQuery = e.target.value.toLowerCase().trim();
                renderTable();
            });

            // Écouteurs pour les nouveaux boutons
            document.getElementById("guide-btn").addEventListener("click", openGuideModal);
            document.getElementById("readme-btn").addEventListener("click", openReadmeModal);
            document.getElementById("author-btn").addEventListener("click", openAuthorModal);
        });

        // CONSTRUIRE LA CHECKLIST GRAPHIQUE DU CHARGEMENT
        function buildProgressChecklist() {
            const container = document.getElementById("progress-checklist");
            CATEGORIES.forEach(cat => {
                container.innerHTML += `
                    <div id="check-${cat.id}" class="flex items-center justify-between text-gray-500">
                        <span><i class="fa-solid fa-circle-notch fa-spin mr-2 text-gray-700"></i>${cat.id}_table.json</span>
                        <span class="text-xs">En attente</span>
                    </div>
                `;
            });
        }

        // SEQUENCE DE TELECHARGEMENT PILOTÉE AVEC EFFET CINÉMATIQUE LISEBLE
        async function initializeLoadingSequence() {
            const progressBar = document.getElementById("progress-bar");
            const statusText = document.getElementById("loading-status-text");
            const totalSteps = CATEGORIES.length + 1; // +1 pour api_version.json
            let completedSteps = 0;

            const updateProgress = (stepId, label, isSuccess) => {
                completedSteps++;
                const percentage = Math.round((completedSteps / totalSteps) * 100);
                progressBar.style.width = `${percentage}%`;
                
                const element = document.getElementById(`check-${stepId}`);
                if (element) {
                    if (isSuccess) {
                        element.className = "flex items-center justify-between text-emerald-400";
                        element.innerHTML = `<span><i class="fa-solid fa-circle-check mr-2"></i>${label}</span><span class="text-xs">OK</span>`;
                    } else {
                        element.className = "flex items-center justify-between text-rose-400";
                        element.innerHTML = `<span><i class="fa-solid fa-circle-xmark mr-2"></i>${label}</span><span class="text-xs">Erreur</span>`;
                    }
                }
            };

            // Fonction utilitaire pour créer une petite pause artificielle (lisibilité)
            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

            // Étape 1 : Récupérer api_version.json
            try {
                statusText.innerText = "Lecture des métadonnées de version...";
                const res = await fetch("data/api_version.json");
                appState.versionInfo = await res.json();
                
                if (appState.versionInfo && appState.versionInfo.last_run) {
                    const dateObj = new Date(appState.versionInfo.last_run);
                    document.getElementById("api-version-info").innerHTML = `
                        <i class="fa-solid fa-clock text-cyan-400"></i> Synchro : ${dateObj.toLocaleString('fr-FR')}
                    `;
                }
                updateProgress("version", "api_version.json", true);
            } catch (e) {
                updateProgress("version", "api_version.json", false);
            }

            await sleep(200); // Petite temporisation rythmique

            // Étapes suivantes : Les fichiers de table pour chaque catégorie
            for (const cat of CATEGORIES) {
                statusText.innerText = `Téléchargement de l'index : ${cat.label}...`;
                try {
                    const res = await fetch(`data/${cat.id}_table.json`);
                    if (!res.ok) throw new Error();
                    appState.tables[cat.id] = await res.json();
                    updateProgress(cat.id, `${cat.id}_table.json`, true);
                } catch (e) {
                    appState.tables[cat.id] = []; 
                    updateProgress(cat.id, `${cat.id}_table.json`, false);
                }
                await sleep(120); // Offre un effet visuel fluide de remplissage progressif
            }

            statusText.innerText = "Finalisation de l'interface...";
            await sleep(800); // Laisse le temps de voir que tous les voyants sont au vert

            const loader = document.getElementById("loading-screen");
            loader.classList.add("opacity-0", "pointer-events-none", "transition-all", "duration-500");
        }

        // CONSTRUIRE LA BARRE D'ONGLETS (DESKTOP & MOBILE)
        function buildNavigationTabs() {
            const desktopNav = document.getElementById("nav-tabs");
            const mobileNav = document.getElementById("nav-tabs-mobile");

            CATEGORIES.forEach(cat => {
                const btnHTML = `
                    <button id="tab-${cat.id}" onclick="switchCategory('${cat.id}')" class="px-4 py-2 border-b-2 border-transparent text-gray-400 hover:text-white hover:border-gray-700 transition-all text-sm font-medium flex items-center gap-2">
                        <i class="fa-solid ${cat.icon} text-xs"></i> ${cat.label}
                    </button>
                `;
                desktopNav.innerHTML += btnHTML;
                
                const mobileHTML = `
                    <button id="tab-mob-${cat.id}" onclick="switchCategory('${cat.id}')" class="px-3 py-1.5 rounded-lg border border-gray-800 text-gray-400 bg-gray-950/40 text-xs font-medium inline-flex items-center gap-1.5">
                        <i class="fa-solid ${cat.icon}"></i> ${cat.label}
                    </button>
                `;
                mobileNav.innerHTML += mobileHTML;
            });
            updateTabStyle();
        }

        // CHANGER DE CATÉGORIE ACTIVE
        function switchCategory(catId) {
            appState.currentCategory = catId;
            updateTabStyle();
            renderTable();
        }

        // METTRE À JOUR LE STYLE GRAPHIQUE DES ONGLETS SÉLECTIONNÉS
        function updateTabStyle() {
            CATEGORIES.forEach(cat => {
                const dTab = document.getElementById(`tab-${cat.id}`);
                const mTab = document.getElementById(`tab-mob-${cat.id}`);
                
                if (cat.id === appState.currentCategory) {
                    if (dTab) dTab.className = "px-4 py-2 border-b-2 text-sm font-medium flex items-center gap-2 tab-active";
                    if (mTab) mTab.className = "px-3 py-1.5 rounded-lg border text-xs font-medium inline-flex items-center gap-1.5 bg-cyan-950/30 border-cyan-500/50 text-cyan-400 drop-shadow-[0_0_6px_rgba(34,211,238,0.3)]";
                } else {
                    if (dTab) dTab.className = "px-4 py-2 border-b-2 border-transparent text-gray-400 hover:text-white hover:border-gray-700 transition-all text-sm font-medium flex items-center gap-2";
                    if (mTab) mTab.className = "px-3 py-1.5 rounded-lg border border-gray-800 text-gray-400 bg-gray-950/40 text-xs font-medium inline-flex items-center gap-1.5";
                }
            });
        }

        // RENDU ULTRA-RAPIDE DU TABLEAU DYNAMIQUE (ZÉRO FREEZE)
        function renderTable() {
            const tbody = document.getElementById("table-body");
            const noResults = document.getElementById("no-results");
            let data = appState.tables[appState.currentCategory] || [];

            // 1. Filtrage par barre de recherche (FR / EN)
            if (appState.searchQuery) {
                data = data.filter(item => 
                    (item.n_fr && item.n_fr.toLowerCase().includes(appState.searchQuery)) ||
                    (item.n_en && item.n_en.toLowerCase().includes(appState.searchQuery))
                );
            }

            // 2. Tri des colonnes
            const col = appState.sortColumn;
            const dir = appState.sortDirection === "asc" ? 1 : -1;
            
            data.sort((a, b) => {
                let valA = a[col] !== undefined ? a[col] : 0;
                let valB = b[col] !== undefined ? b[col] : 0;
                
                if (typeof valA === 'string') {
                    return valA.localeCompare(valB, 'fr') * dir;
                }
                return (valA - valB) * dir;
            });

            updateSortIcons();

            if (data.length === 0) {
                tbody.innerHTML = "";
                noResults.classList.remove("hidden");
                return;
            }
            noResults.classList.add("hidden");

            // OPTIMISATION CRITIQUE : Accumulation dans un flux texte hors-DOM
            let tableHTML = "";
            
            data.forEach(item => {
                tableHTML += `
                    <tr class="table-row-hover border-b border-gray-800/30 cursor-pointer text-gray-300 font-medium" onclick="openItemDetails('${item.id}')">
                        <td class="p-4">
                            <div class="text-white">${item.n_fr || item.id}</div>
                            <div class="text-xs text-gray-500 italic font-mono">${item.n_en || ''}</div>
                        </td>
                        <td class="p-4 text-right font-mono text-cyan-400">${item.p ? item.p.toFixed(1) : '0.0'}</td>
                        <td class="p-4 text-right font-mono ${getPriceColorClass(item.p, item.p30)}">${item.p30 ? item.p30.toFixed(1) : '0.0'}</td>
                        <td class="p-4 text-right font-mono ${getPriceColorClass(item.p, item.p90)}">${item.p90 ? item.p90.toFixed(1) : '0.0'}</td>
                        <td class="p-4 text-right font-mono text-gray-400">${item.v || 0}</td>
                        <td class="p-4 text-right font-mono ${item.vr > 1.5 ? 'text-amber-400' : 'text-gray-400'}">${item.vr ? item.vr.toFixed(2) : '0.00'}</td>
                        <td class="p-4 text-center">
                            <i class="fa-solid fa-shield-heart fiability-${item.f || 0} text-base" title="Indice de fiabilité : ${item.f || 0}/3"></i>
                        </td>
                    </tr>
                `;
            });

            // Une seule et unique injection pour liquider instantanément le freeze
            tbody.innerHTML = tableHTML;
        }

        // DETERMINER LA COULEUR DES TENDANCES DE PRIX
        function getPriceColorClass(current, old) {
            if (!current || !old || current === old) return "text-gray-400";
            return current > old ? "text-emerald-500/90" : "text-rose-500/90";
        }

        // INVERSER LA DIRECTION DU TRI DES COLONNES
        function handleSort(columnName) {
            if (appState.sortColumn === columnName) {
                appState.sortDirection = appState.sortDirection === "asc" ? "desc" : "asc";
            } else {
                appState.sortColumn = columnName;
                appState.sortDirection = columnName === "n_fr" ? "asc" : "desc";
            }
            renderTable();
        }

        // RE-DESSINER LES FLÈCHES DE TRI (▲/▼)
        function updateSortIcons() {
            const columns = ["n_fr", "p", "p30", "p90", "v", "vr", "f"];
            columns.forEach(col => {
                const icon = document.getElementById(`sort-icon-${col}`);
                if (!icon) return;
                
                if (col === appState.sortColumn) {
                    icon.className = appState.sortDirection === "asc" ? "fa-solid fa-sort-up ml-1 text-cyan-400" : "fa-solid fa-sort-down ml-1 text-cyan-400";
                } else {
                    icon.className = "fa-solid fa-sort ml-1 text-gray-800 opacity-30";
                }
            });
        }

        // CHARGEMENT À LA VOLÉE DE LA FICHE D'ENCYCLOPÉDIE DE L'ITEM
        async function openItemDetails(itemId) {
            const cat = appState.currentCategory;
            const modalContainer = document.getElementById("modal-container");
            const modalContent = document.getElementById("modal-content");
            
            // État visuel "Patientez" pré-chargement
            modalContent.innerHTML = `
                <div class="p-12 flex flex-col items-center justify-center gap-3">
                    <i class="fa-solid fa-circle-notch fa-spin text-2xl text-cyan-400"></i>
                    <p class="text-xs text-gray-400 tracking-wide">Extraction de la fiche encyclopédique...</p>
                </div>
            `;
            modalContainer.classList.remove("hidden");
            setTimeout(() => modalContainer.classList.add("modal-show"), 10);
            setTimeout(() => modalContent.classList.add("modal-scale"), 10);

            // Fetch asynchrone ciblé si absent de la mémoire cache
            if (!appState.details[cat]) {
                try {
                    const res = await fetch(`data/${cat}_details.json`);
                    appState.details[cat] = await res.json();
                } catch (e) {
                    appState.details[cat] = {};
                }
            }

            const summary = appState.tables[cat].find(i => i.id === itemId) || {};
            const info = appState.details[cat][itemId] || {};
            const iconUrl = info.icon ? `https://warframe.market/static/assets/${info.icon}` : '';

            // Remplissage dynamique des données réelles
            modalContent.innerHTML = `
                <div class="p-6 bg-gray-950/60 border-b border-gray-800/40 flex items-start justify-between gap-4">
                    <div class="flex items-center gap-4">
                        ${iconUrl ? `<img src="${iconUrl}" alt="${summary.n_fr}" class="w-16 h-16 object-contain bg-gray-950 rounded-xl border border-gray-800 p-1 shadow-inner">` : `
                        <div class="w-16 h-16 bg-gray-950 rounded-xl border border-gray-800 flex items-center justify-center"><i class="fa-solid fa-box text-xl text-gray-600"></i></div>`}
                        <div>
                            <h2 class="text-lg font-bold text-white tracking-wide">${summary.n_fr || itemId}</h2>
                            <p class="text-xs text-gray-400 font-mono italic">${summary.n_en || ''}</p>
                        </div>
                    </div>
                    <button onclick="closeModal()" class="text-gray-500 hover:text-white transition-colors p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                
                <div class="p-6 flex flex-col gap-6 max-h-[70vh] overflow-y-auto">
                    <div class="flex flex-col gap-2">
                        <span class="text-xs font-bold text-cyan-400 uppercase tracking-widest">Description Codex</span>
                        <p class="text-sm text-gray-300 leading-relaxed bg-gray-950/30 border border-gray-800/30 rounded-xl p-3 text-justify italic">

        // CONVERSION SIMPLE MARKDOWN -> HTML
        function markdownToHTML(markdown) {
            let html = markdown
                .replace(/^### (.*?)$/gm, '<h3 class="text-base font-bold text-cyan-400 mt-4 mb-2">$1</h3>')
                .replace(/^## (.*?)$/gm, '<h2 class="text-lg font-bold text-white mt-5 mb-3">$1</h2>')
                .replace(/^# (.*?)$/gm, '<h1 class="text-2xl font-bold text-white mb-4">$1</h1>')
                .replace(/^- (.*?)$/gm, '<li class="ml-4 text-sm">$1</li>')
                .replace(/\*\*(.*?)\*\*/g, '<strong class="text-white">$1</strong>')
                .replace(/\*(.*?)\*/g, '<em class="italic">$1</em>')
                .replace(/`(.*?)`/g, '<code class="bg-gray-950 px-2 py-0.5 rounded font-mono text-cyan-300 text-xs">$1</code>')
                .replace(/\n\n/g, '</p><p class="my-3 leading-relaxed text-justify">')
                .replace(/^(?!<|$)/gm, '<p class="my-2 leading-relaxed text-justify">');
            return `<div class="space-y-3">${html}</div>`;
        }

        // FERMETURE DES MODALES (ANIMATION DE DÉGONFLEMENT FLUIDE)
