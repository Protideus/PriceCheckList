name: Warframe Market Scraper Daily Run

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Scraper V3
      run: |
        python scripts/wfm_scraper.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # On cible le dossier data à la racine avec l'argument -f (force)
        if [ -d "data" ]; then
          git add -f data/*.json
        fi
        
        if git diff --staged --quiet; then
          echo "💤 Aucun changement détecté dans les prix ou les versions. Fin du job."
        else
          git commit -m "📈 Mises à jour quotidiennes de l'index des prix (Automatique)"
          git push
        fi
