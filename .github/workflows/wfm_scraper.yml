name: PCL 1 - Daily Price Scraper

on:
  schedule:
    # Se lance une fois par jour à 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Scraper (Global + Initial WFM50)
      run: |
        python scripts/wfm_scraper.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        if [ -d "data" ]; then
          git add -f data/*.json
        fi
        
        if git diff --staged --quiet; then
          echo "💤 Aucun changement détecté dans les données globales. Fin du job."
        else
          git commit -m "📈 Mise à jour quotidienne globale de l'index des prix"
          git push
        fi
