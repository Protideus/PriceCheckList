name: Warframe Market Scraper V3 Daily Run

on:
  schedule:
    # Déclenchement automatique tous les jours à 02:00 UTC (04:00 heure de Paris en été)
    - cron: '0 2 * * *'
  
  # Permet de lancer le script manuellement depuis l'interface GitHub
  workflow_dispatch:

permissions:
  contents: write  # Autorise GitHub Actions à push les fichiers JSON mis à jour

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    steps:
    # 1. Extraction du code du dépôt
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Installation de Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Optimise les lancements futurs en mettant en cache pip

    # 3. Installation des dépendances (requests)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # 4. Exécution du scraper Python
    - name: Run Scraper V3
      run: |
        python scripts/wfm_scraper_v3.py

    # 5. Détection des changements et commit automatique
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Ajoute uniquement les fichiers du dossier data
        git add data/*.json
        
        # Vérifie s'il y a des modifications avant de commit pour éviter de faire planter le build
        if git diff --staged --quiet; then
          echo "💤 Aucun changement détecté dans les prix ou les versions. Fin du job."
        else
          git commit -m "📈 Mises à jour quotidiennes de l'index des prix (Automatique)"
          git push
        fi
