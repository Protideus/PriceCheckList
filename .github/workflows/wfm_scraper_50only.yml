name: Warframe Market Top 50 Hourly Refresh

#on:
#  schedule:
    # Se lance toutes les heures de 00:00 à 01:00, puis de 03:00 à 23:00
    # On saute volontairement 02:00 pour laisser la place au scraper global
#    - cron: '0 0-1,3-23 * * *'
  workflow_dispatch: # Permet de le lancer manuellement depuis GitHub

permissions:
  contents: write

jobs:
  refresh_top_50:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Fast Top 50 Scraper
      run: |
        python scripts/wfm_scraper_50only.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        if [ -f "data/wfm50_table.json" ]; then
          git add -f data/wfm50_table.json data/version.json
        fi
        
        if git diff --staged --quiet; then
          echo "💤 Aucun changement détecté dans le Top 50. Fin du job."
        else
          git commit -m "⚡ Rafraîchissement horaire automatique du WFM50"
          git push
        fi
